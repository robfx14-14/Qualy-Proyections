<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSL Qualifying Projection - Pro Edition</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap">

  <style>
    :root {
      --f1-bg: #050712;
      --f1-panel: #0b0f1e;
      /* EL DEGRADADO CORAL QUE TE GUSTÓ */
      --f1-gradient: linear-gradient(180deg, #ff5f40 0%, #ff4621 100%);
      --accent-coral: #ff5f40;
    }

    body { padding: 30px; background: var(--f1-bg); color: white; font-family: 'Titillium Web', sans-serif; }

    #capture-area { background: var(--f1-bg); padding: 25px; border-radius: 15px; }

    .f1-card {
      background: var(--f1-panel);
      border-radius: 12px;
      padding: 35px;
      max-width: 950px;
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* PÍLDORA CORAL TSL */
    .f1-pill {
      display: inline-block;
      background: var(--f1-gradient);
      color: white;
      padding: 4px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(255, 95, 64, 0.3);
    }

    h1 { font-weight: 700; font-size: 2rem; text-transform: uppercase; margin: 0; }
    .subtitle-f1 { color: var(--accent-coral); font-weight: 400; font-size: 1.1rem; text-transform: uppercase; margin-bottom: 25px; }

    /* PANEL DE CONTROL (NO SE EXPORTA) */
    .setup-panel { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 10px; border: 1px dashed #333; margin-bottom: 25px; }
    .form-label { font-size: 0.65rem; color: #888; text-transform: uppercase; font-weight: 700; }
    .form-control-sm { background: #050712; border: 1px solid #242a3b; color: white; }

    /* BOTONES MÉTRICA */
    .btn-f1 { background: #050712; border: 1px solid #242a3b; color: #888; font-weight: 600; font-size: 0.75rem; }
    .btn-f1.active { background: var(--f1-gradient); color: white; border-color: transparent; }

    #chart-container { height: 500px; width: 100%; }
    .logo-h { max-height: 90px; margin-bottom: 20px; display: none; margin-inline: auto; }
    .logo-f { max-height: 70px; margin-top: 25px; display: none; margin-inline: auto; }

    .btn-download {
      background: transparent; border: 1px solid var(--accent-coral); color: var(--accent-coral);
      font-weight: 700; padding: 10px 25px; border-radius: 30px; margin-top: 20px; transition: 0.3s;
    }
    .btn-download:hover { background: var(--accent-coral); color: white; }
  </style>
</head>
<body>

<div class="container text-center">
  
  <div class="setup-panel no-print text-start">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">Logo TSL</label><input type="file" id="f1" class="form-control form-control-sm"></div>
      <div class="col-md-4"><label class="form-label">Excel / Datos</label><input type="file" id="f2" class="form-control form-control-sm"></div>
      <div class="col-md-4"><label class="form-label">Logo RDS</label><input type="file" id="f3" class="form-control form-control-sm"></div>
      
      <div class="col-md-4"><label class="form-label">Título Principal</label><input type="text" id="tIn" class="form-control form-control-sm" value="PROJECTED PACE QUALY"></div>
      <div class="col-md-4"><label class="form-label">Subtítulo (GP)</label><input type="text" id="sIn" class="form-control form-control-sm" value="Division 3 - Saudi Arabia GP"></div>
      <div class="col-md-4"><label class="form-label">Leyenda Eje X</label><input type="text" id="xIn" class="form-control form-control-sm" value="Gap to leader (s)"></div>

      <div class="col-md-12">
        <label class="form-label">Seleccionar Métrica</label>
        <div class="btn-group w-100">
          <button id="bB" class="btn btn-f1 active" onclick="setM('BEST', this)">Best Car</button>
          <button id="bR" class="btn btn-f1" onclick="setM('REND', this)">Rendimiento</button>
        </div>
      </div>
    </div>
  </div>

  <div id="capture-area">
    <img id="headImg" class="logo-h">
    <div class="f1-card text-start">
      <div class="f1-pill">Qualifying Pace Projection</div>
      <h1 id="tShow">PROJECTED PACE QUALY</h1>
      <h3 id="sShow" class="subtitle-f1">Division 3 - Saudi Arabia GP</h3>

      <div id="chart-container">
        <canvas id="chartCanvas"></canvas>
      </div>

      <img id="footImg" class="logo-f">
    </div>
  </div>

  <button class="btn-download no-print" onclick="downloadImage()">Descargar Gráfico PNG</button>
  <div class="mt-3 no-print">
    <label class="form-label">Embed Code</label>
    <textarea id="embed" class="form-control form-control-sm" rows="1" readonly style="background:#1a1f2b; border:none; color:#666;"></textarea>
  </div>
</div>

<script>
  Chart.register(ChartDataLabels);
  let chart;
  let raw = [];
  let metric = 'BEST';

  // Sincronización de textos
  document.getElementById('tIn').oninput = e => document.getElementById('tShow').innerText = e.target.value.toUpperCase();
  document.getElementById('sIn').oninput = e => document.getElementById('sShow').innerText = e.target.value;
  document.getElementById('xIn').oninput = () => { if(raw.length) draw(); };

  // Manejo de imágenes
  function setupFile(inId, imgId) {
    document.getElementById(inId).onchange = e => {
      const fr = new FileReader();
      fr.onload = () => { const i = document.getElementById(imgId); i.src = fr.result; i.style.display = 'block'; };
      fr.readAsDataURL(e.target.files[0]);
    };
  }
  setupFile('f1', 'headImg');
  setupFile('f3', 'footImg');

  // Manejo de Excel
  document.getElementById('f2').onchange = e => {
    const fr = new FileReader();
    fr.onload = ev => {
      const wb = XLSX.read(ev.target.result, { type: 'array' });
      raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).filter(r => r.TEAMS);
      draw();
    };
    fr.readAsArrayBuffer(e.target.files[0]);
  };

  function setM(m, b) {
    metric = m;
    document.querySelectorAll('.btn-f1').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if(raw.length) draw();
  }

  const colors = { 'FERRARI': '#E80020', 'RED BULL': '#3671C6', 'MERCEDES': '#27F4D2', 'MCLAREN': '#FF8000', 'ASTON': '#229971', 'ALPINE': '#00A1E8', 'HAAS': '#B6BABD', 'WILLIAMS': '#1868DB', 'SAUBER': '#52E252', 'VCARB': '#6692FF' };

  function draw() {
    const sorted = [...raw].sort((a,b) => (parseFloat(a[metric])||0) - (parseFloat(b[metric])||0));
    const maxVal = Math.max(...sorted.map(r => parseFloat(r[metric]) || 0));
    const xLabel = document.getElementById('xIn').value || 'Gap to leader (s)';

    if(chart) chart.destroy();
    chart = new Chart(document.getElementById('chartCanvas'), {
      type: 'bar',
      data: {
        labels: sorted.map(r => r.TEAMS),
        datasets: [{
          data: sorted.map(r => parseFloat(r[metric]) || 0),
          backgroundColor: sorted.map(r => {
            const k = Object.keys(colors).find(c => r.TEAMS.toUpperCase().includes(c));
            return colors[k] || '#4e5459';
          }),
          barPercentage: 0.75,
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: 'y', maintainAspectRatio: false,
        layout: { padding: { right: 60 } },
        plugins: { 
          legend: false,
          datalabels: {
            color: '#fff', font: { weight: 700, size: 12 },
            formatter: (v) => v.toFixed(3),
            anchor: 'end',
            align: (ctx) => (ctx.dataset.data[ctx.dataIndex] > maxVal * 0.3) ? 'start' : 'right',
            offset: 10
          }
        },
        scales: {
          x: { 
            grid: { color: 'rgba(255,255,255,0.05)' }, 
            ticks: { color: '#888' },
            title: { display: true, text: xLabel, color: '#888', font: { size: 12, weight: 600 } }
          },
          y: { grid: { display: false }, ticks: { color: '#fff', font: { weight: 600 } } }
        }
      }
    });
    document.getElementById('embed').value = `<iframe src="${window.location.href}" style="width:100%;height:600px;border:none;"></iframe>`;
  }

  function downloadImage() {
    html2canvas(document.getElementById('capture-area'), { backgroundColor: '#050712', scale: 2 }).then(canvas => {
      const a = document.createElement('a');
      a.download = 'TSL-Pace-Projection.png';
      a.href = canvas.toDataURL("image/png");
      a.click();
    });
  }
</script>
</body>
</html>
